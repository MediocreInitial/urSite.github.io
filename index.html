<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гриша Подшипник</title>
  <!-- Иконки FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #030408;
      --purple-accent: #a855f7;
      --cyan-accent: #06b6d4;
      --blue-accent: #3b82f6;
      --pink-accent: #ec4899;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 25px 15px 50px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* --- БЫСТРЫЙ ДИНАМИЧЕСКИЙ ПЕРЕЛИВАЮЩИЙСЯ ФОН --- */
    .bg-gradient-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: #05070f;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.85;
      will-change: transform;
    }

    /* Ускоренные динамические петли градиента */
    .blob-1 {
      top: -10%;
      left: -10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--purple-accent) 0%, var(--pink-accent) 70%, transparent 100%);
      animation: fastMove1 4.5s infinite ease-in-out alternate;
    }

    .blob-2 {
      bottom: -15%;
      right: -10%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, var(--cyan-accent) 0%, var(--blue-accent) 70%, transparent 100%);
      animation: fastMove2 3.8s infinite ease-in-out alternate;
    }

    .blob-3 {
      top: 40%;
      left: 15%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--pink-accent) 0%, var(--purple-accent) 70%, transparent 100%);
      animation: fastMove3 5s infinite ease-in-out alternate;
    }

    .blob-4 {
      bottom: 25%;
      left: -10%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--blue-accent) 0%, var(--cyan-accent) 70%, transparent 100%);
      animation: fastMove1 3.2s infinite ease-in-out alternate-reverse;
    }

    @keyframes fastMove1 {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(100px, 120px) scale(1.3) rotate(90deg); }
      100% { transform: translate(-60px, 80px) scale(0.9) rotate(180deg); }
    }

    @keyframes fastMove2 {
      0% { transform: translate(0, 0) scale(1.1); }
      50% { transform: translate(-120px, -90px) scale(0.85); }
      100% { transform: translate(80px, -50px) scale(1.25); }
    }

    @keyframes fastMove3 {
      0% { transform: translate(-40px, 50px) scale(0.9); }
      50% { transform: translate(90px, -80px) scale(1.35); }
      100% { transform: translate(-80px, -40px) scale(1); }
    }

    /* --- КОНТЕЙНЕР --- */
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Аватарка */
    .avatar-box {
      position: relative;
      margin-top: 10px;
    }

    .avatar {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.6), 0 0 15px rgba(6, 182, 212, 0.5);
    }

    h1 {
      font-size: 27px;
      font-weight: 800;
      margin-top: 14px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .quote {
      color: var(--text-sub);
      font-style: italic;
      font-size: 13.5px;
      margin-top: 5px;
      text-align: center;
    }

    /* --- МАТОВЫЕ МАТОВЫЕ ПЛАШКИ С ОТРAЖЕНИЕМ И ПРЕЛОМЛЕНИЕМ СВЕТА --- */
    .frosted-glass {
      position: relative;
      background: rgba(18, 22, 38, 0.45); /* Полупрозрачная матовая основа */
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 22px;
      /* Преломляющая хроматическая окантовка (RGB Сквозной спектр) */
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.45),
        -1px -1px 2px rgba(6, 182, 212, 0.25), /* Хроматический преломляющий синий */
        1px 1px 2px rgba(236, 72, 153, 0.25),  /* Хроматический преломляющий розовый */
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -1px 1px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  box-shadow 0.22s ease, 
                  border-color 0.22s ease,
                  background 0.22s ease;
      cursor: pointer;
    }

    /* Динамический матовый блик света (Reflective Light Layer) */
    .frosted-glass::before {
      content: '';
      position: absolute;
      top: var(--mouse-y, 0%);
      left: var(--mouse-x, 0%);
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .frosted-glass:hover::before {
      opacity: 1;
    }

    /* Верхний светящийся скос стекла */
    .frosted-glass::after {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      pointer-events: none;
    }

    /* --- УПРУГИЙ ИНТЕРАКТИВНЫЙ ОТКЛИК ПРИ НАЖАТИИ (BOUNCE & SCALE) --- */
    .frosted-glass:active, .btn-bounce:active {
      transform: scale(0.94) !important;
      background: rgba(30, 36, 60, 0.65) !important;
      border-color: rgba(255, 255, 255, 0.5) !important;
      box-shadow: 
        0 5px 15px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(168, 85, 247, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.6) !important;
    }

    /* Статус */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 12px;
      color: #ffffff;
      margin-top: 14px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--cyan-accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan-accent);
    }

    /* Плеер фоновой музыки */
    .music-player {
      width: 100%;
      padding: 12px 18px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1;
    }

    .music-btn {
      background: linear-gradient(135deg, var(--purple-accent), var(--cyan-accent));
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.5);
      font-size: 16px;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }

    /* Заголовки разделов */
    .section-title {
      align-self: flex-start;
      font-size: 16.5px;
      font-weight: 700;
      margin: 24px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(to bottom, var(--purple-accent), var(--cyan-accent));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--purple-accent);
    }

    /* Сетка соцсетей */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }

    .card {
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .card i {
      font-size: 28px;
      background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    .card:active i {
      transform: scale(0.9);
    }

    .card span {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      z-index: 1;
    }

    /* Информационный бокс */
    .notice-box {
      width: 100%;
      padding: 14px 16px;
      margin-top: 5px;
      font-size: 13px;
      color: #ffffff;
      line-height: 1.4;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- Динамический переливающийся абстрактный фон -->
  <div class="bg-gradient-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- Аудиофайлы -->
  <audio id="click-sound" src="click.mp3" preload="auto"></audio>
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <div class="container">
    <!-- Аватарка -->
    <div class="avatar-box">
      <img class="avatar" src="IMG_0294.png" alt="Avatar">
    </div>

    <!-- Имя и цитата -->
    <h1>Гриша Подшипник</h1>
    <p class="quote">"Волк не тот, кто волк, а тот, кто волк..."</p>

    <!-- Статус -->
    <div class="status-badge frosted-glass sound-btn">
      <span class="dot"></span>
      Ремонт Унитазов, Альметьевск
    </div>

    <!-- Плеер фоновой музыки -->
    <div class="music-player frosted-glass">
      <div class="music-info">
        <i class="fa-solid fa-compact-disc" id="disc-icon" style="color: var(--cyan-accent); font-size: 18px;"></i>
        <span id="music-status">Фоновый трек</span>
      </div>
      <button class="music-btn btn-bounce" id="play-btn">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>
    </div>

    <!-- Медиа & Связь -->
    <div class="section-title">Медиа & Связь</div>
    <div class="grid">
      <a href="https://twitch.tv" class="card frosted-glass sound-btn" target="_blank">
        <i class="fa-brands fa-twitch"></i>
        <span>Twitch</span>
      </a>
      <a href="https://t.me" class="card frosted-glass sound-btn" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        <span>Telegram</span>
      </a>
      <a href="https://youtube.com" class="card frosted-glass sound-btn" target="_blank">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube</span>
      </a>
      <a href="https://tiktok.com" class="card frosted-glass sound-btn" target="_blank">
        <i class="fa-brands fa-tiktok"></i>
        <span>TikTok</span>
      </a>
      <a href="https://vk.com" class="card frosted-glass sound-btn" target="_blank">
        <i class="fa-brands fa-vk"></i>
        <span>ВКонтакте</span>
      </a>
      <a href="https://discord.com" class="card frosted-glass sound-btn" target="_blank">
        <i class="fa-brands fa-discord"></i>
        <span>Discord</span>
      </a>
    </div>

    <!-- Поддержка -->
    <div class="section-title">Поддержка</div>
    <div class="notice-box frosted-glass">
      ⚠ <b>ВНИМАНИЕ:</b> Просьба не отправлять громкие звуки.
    </div>
    
    <div class="grid" style="margin-top: 14px;">
      <a href="https://donationalerts.com" class="card frosted-glass sound-btn" target="_blank">
        <i class="fa-solid fa-coins"></i>
        <span>DonationAlerts</span>
      </a>
      <a href="#" class="card frosted-glass sound-btn">
        <i class="fa-solid fa-bell"></i>
        <span>MemeAlerts</span>
      </a>
    </div>
  </div>

  <!-- Скрипт звукового отклика и динамических отблесков -->
  <script>
    const clickSound = document.getElementById('click-sound');
    const bgMusic = document.getElementById('bg-music');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const discIcon = document.getElementById('disc-icon');
    const musicStatus = document.getElementById('music-status');

    // Синтезатор акустического щелчка
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticClick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.035);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.035);
    }

    function triggerClickSound() {
      if (clickSound.readyState >= 2) {
        clickSound.currentTime = 0;
        clickSound.play().catch(() => playSyntheticClick());
      } else {
        playSyntheticClick();
      }
    }

    let startX = 0, startY = 0;

    // Динамический свет при наведении/касании и отклик
    document.querySelectorAll('.frosted-glass').forEach(card => {
      card.addEventListener('pointermove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);
      });

      card.addEventListener('pointerdown', e => {
        startX = e.clientX;
        startY = e.clientY;
      });

      card.addEventListener('pointerup', e => {
        const diffX = Math.abs(e.clientX - startX);
        const diffY = Math.abs(e.clientY - startY);

        if (diffX < 8 && diffY < 8 && card.classList.contains('sound-btn')) {
          triggerClickSound();
        }
      });
    });

    // Управление плеером
    playBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      triggerClickSound();
      
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          playIcon.className = 'fa-solid fa-pause';
          discIcon.classList.add('fa-spin');
          musicStatus.innerText = 'Играет трек';
        }).catch(() => {
          alert('Файл music.mp3 не найден или еще загружается!');
        });
      } else {
        bgMusic.pause();
        playIcon.className = 'fa-solid fa-play';
        discIcon.classList.remove('fa-spin');
        musicStatus.innerText = 'Пауза';
      }
    });
  </script>
</body>
</html>
