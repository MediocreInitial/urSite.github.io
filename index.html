<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гриша Подшипник</title>
  <!-- Иконки FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0d19;
      --card-bg: rgba(22, 27, 46, 0.45);
      --card-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: rgba(255, 255, 255, 0.25);
      --purple-accent: #a855f7;
      --cyan-accent: #06b6d4;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 15px 40px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Анимированный живой фон */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: float 14s infinite ease-in-out alternate;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--purple-accent), transparent 70%);
      animation-duration: 12s;
    }

    .blob-2 {
      bottom: -10%;
      right: -10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--cyan-accent), transparent 70%);
      animation-duration: 16s;
    }

    .blob-3 {
      top: 45%;
      left: 30%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4), rgba(6, 182, 212, 0.4));
      animation-duration: 10s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(30px, -40px) scale(1.15);
      }
      100% {
        transform: translate(-20px, 30px) scale(0.95);
      }
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Аватарка с неоновым свечением */
    .avatar-box {
      position: relative;
      margin-top: 15px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, var(--purple-accent), var(--cyan-accent)) border-box;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), 0 0 10px rgba(6, 182, 212, 0.3);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-top: 15px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .quote {
      color: var(--text-sub);
      font-style: italic;
      font-size: 14px;
      margin-top: 6px;
      text-align: center;
    }

    /* Плашка статуса Liquid Glass */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 12px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25), inset 0 1px 1px var(--glass-highlight);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--cyan-accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan-accent);
    }

    /* Плеер фоновой музыки (Liquid Glass) */
    .music-player {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 12px 16px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 1px 2px var(--glass-highlight);
      position: relative;
      overflow: hidden;
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .music-btn {
      background: linear-gradient(135deg, var(--purple-accent), var(--cyan-accent));
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    .music-btn:active {
      transform: scale(0.92);
    }

    /* Заголовки разделов */
    .section-title {
      align-self: flex-start;
      font-size: 17px;
      font-weight: 700;
      margin: 25px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(to bottom, var(--purple-accent), var(--cyan-accent));
      border-radius: 2px;
      box-shadow: 0 0 8px var(--purple-accent);
    }

    /* Сетка и карточки в стиле Liquid Glass */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36), inset 0 1px 1px var(--glass-highlight);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    /* Блик жидкого стекла */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.15),
        transparent
      );
      transition: 0.5s;
      pointer-events: none;
    }

    .card:hover::before {
      left: 100%;
    }

    /* Отклик при нажатии на карточку */
    .card:active {
      transform: scale(0.95);
      border-color: rgba(6, 182, 212, 0.5);
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .card i {
      font-size: 26px;
      background: linear-gradient(135deg, #e9d5ff, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card span {
      font-size: 13px;
      font-weight: 600;
    }

    /* Информационный бокс Liquid Glass */
    .notice-box {
      width: 100%;
      background: rgba(168, 85, 247, 0.08);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 12px 15px;
      margin-top: 10px;
      font-size: 13px;
      color: #e9d5ff;
      line-height: 1.4;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25), inset 0 1px 1px var(--glass-highlight);
    }
  </style>
</head>
<body>

  <!-- Живые градиентные фигуры фона -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Аудиофайлы -->
  <audio id="click-sound" src="click.mp3" preload="auto"></audio>
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <div class="container">
    <!-- Аватарка -->
    <div class="avatar-box">
      <img class="avatar" src="IMG_0294.png" alt="Avatar">
    </div>

    <!-- Имя и цитата -->
    <h1>Гриша Подшипник</h1>
    <p class="quote">"Волк не тот, кто волк, а тот, кто волк..."</p>

    <!-- Статус (с исправленной опечаткой) -->
    <div class="status-badge">
      <span class="dot"></span>
      Ремонт Унитазов, Альметьевск
    </div>

    <!-- Плеер фоновой музыки -->
    <div class="music-player">
      <div class="music-info">
        <i class="fa-solid fa-compact-disc" id="disc-icon" style="color: var(--cyan-accent);"></i>
        <span id="music-status">Фоновый трек</span>
      </div>
      <button class="music-btn" id="play-btn">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>
    </div>

    <!-- Медиа & Связь -->
    <div class="section-title">Медиа & Связь</div>
    <div class="grid">
      <a href="https://twitch.tv" class="card sound-btn" target="_blank">
        <i class="fa-brands fa-twitch"></i>
        <span>Twitch</span>
      </a>
      <a href="https://t.me" class="card sound-btn" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        <span>Telegram</span>
      </a>
      <a href="https://youtube.com" class="card sound-btn" target="_blank">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube</span>
      </a>
      <a href="https://tiktok.com" class="card sound-btn" target="_blank">
        <i class="fa-brands fa-tiktok"></i>
        <span>TikTok</span>
      </a>
      <a href="https://vk.com" class="card sound-btn" target="_blank">
        <i class="fa-brands fa-vk"></i>
        <span>ВКонтакте</span>
      </a>
      <a href="https://discord.com" class="card sound-btn" target="_blank">
        <i class="fa-brands fa-discord"></i>
        <span>Discord</span>
      </a>
    </div>

    <!-- Поддержка -->
    <div class="section-title">Поддержка</div>
    <div class="notice-box">
      ⚠️ <b>ВНИМАНИЕ:</b> Просьба не отправлять громкие звуки.
    </div>
    
    <div class="grid" style="margin-top: 12px;">
      <a href="https://donationalerts.com" class="card sound-btn" target="_blank">
        <i class="fa-solid fa-coins"></i>
        <span>DonationAlerts</span>
      </a>
      <a href="#" class="card sound-btn">
        <i class="fa-solid fa-bell"></i>
        <span>MemeAlerts</span>
      </a>
    </div>
  </div>

  <!-- Скрипт для звуков и плеера -->
  <script>
    const clickSound = document.getElementById('click-sound');
    const bgMusic = document.getElementById('bg-music');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const discIcon = document.getElementById('disc-icon');
    const musicStatus = document.getElementById('music-status');

    // Резервный синтезатор щелчка для iOS/Safari
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticClick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Воспроизведение звука строго по клику (переходу)
    document.querySelectorAll('.sound-btn').forEach(button => {
      button.addEventListener('click', function() {
        if (clickSound.readyState >= 2) {
          clickSound.currentTime = 0;
          clickSound.play().catch(() => playSyntheticClick());
        } else {
          playSyntheticClick();
        }
      });
    });

    // Управление музыкой (Play / Pause)
    playBtn.addEventListener('click', function(e) {
      e.preventDefault();
      
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          playIcon.className = 'fa-solid fa-pause';
          discIcon.classList.add('fa-spin');
          musicStatus.innerText = 'Играет трек';
        }).catch(err => {
          alert('Файл music.mp3 не найден на GitHub или загружается!');
        });
      } else {
        bgMusic.pause();
        playIcon.className = 'fa-solid fa-play';
        discIcon.classList.remove('fa-spin');
        musicStatus.innerText = 'Пауза';
      }
    });
  </script>
</body>
</html>
