<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гриша Подшипник</title>
  <!-- Иконки FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #06070d;
      --purple-accent: #a855f7;
      --cyan-accent: #06b6d4;
      --blue-accent: #3b82f6;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 15px 50px 15px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* --- АКТИВНЫЙ ДИНАМИЧЕСКИЙ ФОН --- */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, #0d0f1d 0%, #030408 100%);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.85;
      will-change: transform;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--purple-accent), transparent 70%);
      animation: float1 10s infinite ease-in-out alternate;
    }

    .blob-2 {
      bottom: -10%;
      right: -10%;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, var(--cyan-accent), transparent 70%);
      animation: float2 13s infinite ease-in-out alternate;
    }

    .blob-3 {
      top: 35%;
      left: 20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--blue-accent), transparent 70%);
      animation: float3 8s infinite ease-in-out alternate;
    }

    .blob-4 {
      bottom: 20%;
      left: -5%;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.7), transparent 70%);
      animation: float1 15s infinite ease-in-out alternate-reverse;
    }

    @keyframes float1 {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      50% { transform: translate(60px, 80px) rotate(180deg) scale(1.25); }
      100% { transform: translate(-40px, 40px) rotate(360deg) scale(0.9); }
    }

    @keyframes float2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-80px, -60px) scale(1.2); }
      100% { transform: translate(50px, -30px) scale(0.85); }
    }

    @keyframes float3 {
      0% { transform: translate(0, 0) scale(0.9); }
      50% { transform: translate(50px, -50px) scale(1.3); }
      100% { transform: translate(-50px, 50px) scale(1); }
    }

    /* --- КОНТЕЙНЕР СТРАНИЦЫ --- */
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* --- АВАТАРКА --- */
    .avatar-box {
      position: relative;
      margin-top: 15px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.5), 0 0 15px rgba(6, 182, 212, 0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-top: 15px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .quote {
      color: var(--text-sub);
      font-style: italic;
      font-size: 14px;
      margin-top: 6px;
      text-align: center;
    }

    /* --- ТЕМНОЕ ТЕМПЕРИРОВАННОЕ СТЕКЛО (Dark Glossy Glass) --- */
    .glass-panel {
      position: relative;
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.12) 0%, 
        rgba(20, 24, 40, 0.35) 45%, 
        rgba(0, 0, 0, 0.45) 100%
      );
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.6),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  box-shadow 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.25s ease;
    }

    /* Диагональный глянцевый блик */
    .glass-panel::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        125deg, 
        rgba(255, 255, 255, 0.22) 0%, 
        rgba(255, 255, 255, 0.05) 40%, 
        transparent 40.5%, 
        transparent 100%
      );
      pointer-events: none;
    }

    /* Искрящийся блик по углу обводки */
    .glass-panel::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 18px;
      width: 30px;
      height: 2px;
      background: #ffffff;
      filter: blur(1px);
      box-shadow: 0 0 8px #ffffff;
      opacity: 0.7;
      pointer-events: none;
    }

    /* --- РИППЛ-ВОЛНА ПРИ КЛИКЕ --- */
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 70%);
      transform: scale(0);
      animation: ripple 0.55s cubic-bezier(0.1, 0.8, 0.3, 1);
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    .glass-panel:active {
      transform: scale(0.95);
      box-shadow: 
        0 8px 20px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.55);
    }

    /* Статус */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 12px;
      color: #ffffff;
      margin-top: 14px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--cyan-accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan-accent);
    }

    /* Плеер фоновой музыки */
    .music-player {
      width: 100%;
      padding: 12px 18px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1;
    }

    .music-btn {
      background: linear-gradient(135deg, var(--purple-accent), var(--cyan-accent));
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.5);
      font-size: 16px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }

    .music-btn:active {
      transform: scale(0.88);
    }

    /* Заголовки разделов */
    .section-title {
      align-self: flex-start;
      font-size: 17px;
      font-weight: 700;
      margin: 25px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(to bottom, var(--purple-accent), var(--cyan-accent));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--purple-accent);
    }

    /* Сетка карточек */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }

    .card {
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
    }

    .card i {
      font-size: 28px;
      background: linear-gradient(135deg, #ffffff 40%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      z-index: 1;
    }

    .card span {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      z-index: 1;
    }

    /* Информационный бокс */
    .notice-box {
      width: 100%;
      padding: 14px 16px;
      margin-top: 10px;
      font-size: 13px;
      color: #ffffff;
      line-height: 1.4;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- Динамический анимированный фон -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- Аудиофайлы -->
  <audio id="click-sound" src="click.mp3" preload="auto"></audio>
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <div class="container">
    <!-- Аватарка -->
    <div class="avatar-box">
      <img class="avatar" src="IMG_0294.png" alt="Avatar">
    </div>

    <!-- Имя и цитата -->
    <h1>Гриша Подшипник</h1>
    <p class="quote">"Волк не тот, кто волк, а тот, кто волк..."</p>

    <!-- Статус -->
    <div class="status-badge glass-panel">
      <span class="dot"></span>
      Ремонт Унитазов, Альметьевск
    </div>

    <!-- Плеер фоновой музыки -->
    <div class="music-player glass-panel">
      <div class="music-info">
        <i class="fa-solid fa-compact-disc" id="disc-icon" style="color: var(--cyan-accent); font-size: 18px;"></i>
        <span id="music-status">Фоновый трек</span>
      </div>
      <button class="music-btn" id="play-btn">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>
    </div>

    <!-- Медиа & Связь -->
    <div class="section-title">Медиа & Связь</div>
    <div class="grid">
      <a href="https://twitch.tv" class="card glass-panel sound-btn" target="_blank">
        <i class="fa-brands fa-twitch"></i>
        <span>Twitch</span>
      </a>
      <a href="https://t.me" class="card glass-panel sound-btn" target="_blank">
        <i class="fa-brands fa-telegram"></i>
        <span>Telegram</span>
      </a>
      <a href="https://youtube.com" class="card glass-panel sound-btn" target="_blank">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube</span>
      </a>
      <a href="https://tiktok.com" class="card glass-panel sound-btn" target="_blank">
        <i class="fa-brands fa-tiktok"></i>
        <span>TikTok</span>
      </a>
      <a href="https://vk.com" class="card glass-panel sound-btn" target="_blank">
        <i class="fa-brands fa-vk"></i>
        <span>ВКонтакте</span>
      </a>
      <a href="https://discord.com" class="card glass-panel sound-btn" target="_blank">
        <i class="fa-brands fa-discord"></i>
        <span>Discord</span>
      </a>
    </div>

    <!-- Поддержка -->
    <div class="section-title">Поддержка</div>
    <div class="notice-box glass-panel">
      ⚠️ <b>ВНИМАНИЕ:</b> Просьба не отправлять громкие звуки.
    </div>
    
    <div class="grid" style="margin-top: 14px;">
      <a href="https://donationalerts.com" class="card glass-panel sound-btn" target="_blank">
        <i class="fa-solid fa-coins"></i>
        <span>DonationAlerts</span>
      </a>
      <a href="#" class="card glass-panel sound-btn">
        <i class="fa-solid fa-bell"></i>
        <span>MemeAlerts</span>
      </a>
    </div>
  </div>

  <!-- Скрипт для звуков и плеера (С защитой от срабатывания при прокрутке) -->
  <script>
    const clickSound = document.getElementById('click-sound');
    const bgMusic = document.getElementById('bg-music');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const discIcon = document.getElementById('disc-icon');
    const musicStatus = document.getElementById('music-status');

    // Резервный синтезатор щелчка для iOS/Safari
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSyntheticClick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(850, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function triggerClickSound() {
      if (clickSound.readyState >= 2) {
        clickSound.currentTime = 0;
        clickSound.play().catch(() => playSyntheticClick());
      } else {
        playSyntheticClick();
      }
    }

    let startX = 0;
    let startY = 0;

    document.querySelectorAll('.glass-panel').forEach(panel => {
      panel.addEventListener('pointerdown', function(e) {
        startX = e.clientX;
        startY = e.clientY;

        const rect = this.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'ripple-effect';
        const diameter = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${diameter}px`;
        ripple.style.left = `${e.clientX - rect.left - diameter / 2}px`;
        ripple.style.top = `${e.clientY - rect.top - diameter / 2}px`;
        
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 550);
      });

      // Воспроизведение звука только при клике (без свайпа)
      panel.addEventListener('pointerup', function(e) {
        const diffX = Math.abs(e.clientX - startX);
        const diffY = Math.abs(e.clientY - startY);

        if (diffX < 8 && diffY < 8 && this.classList.contains('sound-btn')) {
          triggerClickSound();
        }
      });
    });

    // Управление музыкой (Play / Pause)
    playBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          playIcon.className = 'fa-solid fa-pause';
          discIcon.classList.add('fa-spin');
          musicStatus.innerText = 'Играет трек';
        }).catch(err => {
          alert('Файл music.mp3 не найден на GitHub или загружается!');
        });
      } else {
        bgMusic.pause();
        playIcon.className = 'fa-solid fa-play';
        discIcon.classList.remove('fa-spin');
        musicStatus.innerText = 'Пауза';
      }
    });
  </script>
</body>
</html>
